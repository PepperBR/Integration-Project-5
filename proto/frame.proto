syntax = "proto3";

package frame.v1;

message ParsedFieldProto {
    string identifier = 1;
    string name = 2;
    string value_bytes = 3;
    repeated ParsedFieldProto values = 4;
}

message ErrorProto {
    string message = 1;
}

message VerifyFrameRequestProto {
    string raw_frame = 1;
}

message VerifyFrameResponseProto {
    ParsedFieldProto fields = 1;
    optional ErrorProto error = 2;
}

service FrameService {
    rpc VerifyFrame(VerifyFrameRequestProto) returns (VerifyFrameResponseProto);
}