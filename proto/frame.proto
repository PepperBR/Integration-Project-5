syntax = "proto3";

package frame.v1;

message ParsedField {
    string name = 1;
    uint32 offset = 2;
    uint32 length = 3;
    string value = 4;
    string description = 5;
}

message ValidationError {
    uint32 code = 1;
    string message = 2;
}

message VerifyFrameRequest {
    string raw_frame = 1;
}

message VerifyFrameResponse {
    bool valid = 1;
    repeated ParsedField fields = 2;
    repeated ValidationError errors = 3;
}

service FrameService {
    rpc VerifyFrame(VerifyFrameRequest) returns (VerifyFrameResponse);
}